name: Docker Build & Push (terranova-web-app)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/terranova-web-docker.yaml'
      - 'helm-charts/terranova-web/**'
      - 'apps/terranova-web/**'
  schedule:
    - cron: '0 6 * * 2-5' # Tuesday to Friday at 6:00 AM UTC
  workflow_dispatch:

env:
    DOCKER_USER: harrisonmeister
    IMAGE_NAME: terranova-web
    OCTOPUS_PROJECT: Terranova web
    SBOM_OUTPUT_FILE: dependency-results.sbom.json
    SBOM_PACKAGE_NAME: terranova-web-sbom
    OCTOPUS_URL: ${{ vars.DEMO_OCTOPUS_URL }}
    OCTOPUS_SPACE: ${{ vars.DEMO_OCTOPUS_SPACE }}
    
jobs:      
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 
      id-token: write
      attestations: write
      
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - name: Calculate Version Tag
        id: version
        run: |
          DATE=$(date +%Y.%m.%d)
          VERSION_TAG="${DATE}.${{ github.run_number }}"
          echo "tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "Generated tag: $VERSION_TAG"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./apps/terranova-web
          file: ./apps/terranova-web/Dockerfile
          push: true
          load: false
          tags: |
            ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Run Trivy in GitHub SBOM mode
        # v0.35.0
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: "fs"
          format: "github"
          output: ${{ env.SBOM_OUTPUT_FILE }}
          scan-ref: "."
          github-pat: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Zip SBOM Package for Octopus Deploy 🐙
        id: package
        run: |
          PACKAGE_ID="${{ env.SBOM_PACKAGE_NAME }}"
          VERSION="${{ steps.version.outputs.tag }}"
          ZIP_FILENAME="${PACKAGE_ID}.${VERSION}.zip"
          
          # Create a directory to ensure the zip is structured correctly
          mkdir -p packaging
          
          # Zip the SBOM file
          zip -j packaging/$ZIP_FILENAME ${{ env.SBOM_OUTPUT_FILE }}
          
          echo "package_file=packaging/$ZIP_FILENAME" >> $GITHUB_OUTPUT

      - name: Create the Subject Checksum file for Attestation Build Provenance
        id: determine_sbom_hash
        shell: pwsh
        run: |
          $packageHash = Get-FileHash -path "${{ steps.package.outputs.package_file }}" -Algorithm SHA256
          $hashToSave = $packageHash.Hash
          Write-Host "The SBOM package hash is: $hashToSave"
          "SBOM_HASH=$hashToSave" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create the subject checksum file for DockerHub provenance
        shell: pwsh
        run: |
          $cleanedSbomSha = $("${{ steps.determine_sbom_hash.outputs.SBOM_HASH }}" -replace "sha256:", "").Trim()
          $cleanedImageSha = $("${{ steps.build.outputs.digest }}" -replace "sha256:", "").Trim()
          $dockerImageSubject = "${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}".Trim()
          $sbomSubject = "${{ steps.package.outputs.package_file }}".Trim()
          Write-Host "The DockerHub image is $cleanedImageSha  $dockerImageSubject"
          Write-Host "The SBOM information is $cleanedSbomSha  $sbomSubject"
          $subjectText = @"
          $cleanedImageSha  $dockerImageSubject
          $cleanedSbomSha  $sbomSubject
          "@
          Write-Host "Creating the DockerHub checksums file"
          New-Item -Path . -Name "dockerhub.subject.checksums.txt" -ItemType "File" -Value $subjectText

      - name: Create the subject checksum file for GHCR provenance
        shell: pwsh
        run: |
          $cleanedSbomSha = $("${{ steps.determine_sbom_hash.outputs.SBOM_HASH }}" -replace "sha256:", "").Trim()
          $cleanedImageSha = $("${{ steps.build.outputs.digest }}" -replace "sha256:", "").Trim()
          $ghcrImageSubject = "ghcr.io/${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}".Trim()
          $sbomSubject = "${{ steps.package.outputs.package_file }}".Trim()
          Write-Host "The GHCR image is $cleanedImageSha  $ghcrImageSubject"
          Write-Host "The SBOM information is $cleanedSbomSha  $sbomSubject"
          $subjectText = @"
          $cleanedImageSha  $ghcrImageSubject
          $cleanedSbomSha  $sbomSubject
          "@
          Write-Host "Creating the GHCR checksums file"
          New-Item -Path . -Name "ghcr.subject.checksums.txt" -ItemType "File" -Value $subjectText    

      - name: Generate DockerHub attestation from provenance
        uses: actions/attest-build-provenance@v2
        id: dockerhub-attestations
        with:
          subject-checksums: dockerhub.subject.checksums.txt

      - name: Generate GHCR attestation from provenance
        uses: actions/attest-build-provenance@v2
        id: ghcr-attestations
        with:
          subject-checksums: ghcr.subject.checksums.txt

      - name: Login to Octopus Deploy 🐙
        uses: OctopusDeploy/login@v2
        with: 
          server: ${{ env.OCTOPUS_URL }}
          service_account_id: 4d50c8ac-1515-4351-96a7-4a82d55d55ff
      
      - name: Push SBOM Package to Octopus Deploy 🐙
        uses: OctopusDeploy/push-package-action@v3
        with:
          packages: |
            ${{ steps.package.outputs.package_file }}
  push-build-info:
    name: Push build information to Octopus 🐙
    permissions:
      id-token: write
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Login to Octopus Deploy 🐙
        uses: OctopusDeploy/login@v2
        with:
          server: ${{ env.OCTOPUS_URL }}
          service_account_id: 4d50c8ac-1515-4351-96a7-4a82d55d55ff
      - name: Push build information to Octopus Deploy 🐙
        uses: OctopusDeploy/push-build-information-action@v4
        with:
          version: ${{ needs.build.outputs.version }}
          packages: |
            ${{ env.SBOM_PACKAGE_NAME }}
            ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}

  create-octopus-release:
    name: Create Octopus Release 🐙
    permissions:
      id-token: write
    needs: [build, push-build-info]
    runs-on: ubuntu-latest
    steps:
      - name: Login to Octopus Deploy 🐙
        uses: OctopusDeploy/login@v2
        with:
          server: ${{ env.OCTOPUS_URL }}
          service_account_id: 4d50c8ac-1515-4351-96a7-4a82d55d55ff

      - name: Create Octopus Release 🐙
        uses: OctopusDeploy/create-release-action@v4
        id: "create-release"
        with:
          project: ${{ env.OCTOPUS_PROJECT }}
          release_number: ${{ needs.build.outputs.version }}
    outputs:
      release_number: ${{ steps.create-release.outputs.release_number }}

  deploy-octopus-release:
    name: Deploy to Development 🐙
    permissions:
      id-token: write
    needs: [build, push-build-info, create-octopus-release]
    runs-on: ubuntu-latest
    steps:
      - name: Login to Octopus Deploy 🐙
        uses: OctopusDeploy/login@v2
        with:
          server: ${{ env.OCTOPUS_URL }}
          service_account_id: 4d50c8ac-1515-4351-96a7-4a82d55d55ff

      - name: Deploy internal tenant to Development  🐙
        uses: OctopusDeploy/deploy-release-tenanted-action@v4
        id: "deploy-release"
        with:
          project: ${{ env.OCTOPUS_PROJECT }}
          release_number: ${{ needs.create-octopus-release.outputs.release_number }}
          environment: |
            Development
          tenants: |
            -Internal-
          
      - name: Stream Octopus task logs 🐙
        run: |
          set +e

          TASK_ID=$(echo '${{ steps.deploy-release.outputs.server_tasks }}' | jq -r '.[0].serverTaskId')
          OCTOPUS_URL="${{ env.OCTOPUS_URL }}"
          OCTOPUS_URL="${OCTOPUS_URL%/}"

          ENCODED_SPACE="${{ env.OCTOPUS_SPACE }}"
          ENCODED_SPACE="${ENCODED_SPACE// /+}"
          SPACE_ID=$(curl -sf \
            -H "Authorization: Bearer $OCTOPUS_ACCESS_TOKEN" \
            "$OCTOPUS_URL/api/spaces?partialName=$ENCODED_SPACE" \
            | jq -r --arg name "${{ env.OCTOPUS_SPACE }}" '.Items[] | select(.Name == $name) | .Id')

          if [ -z "$SPACE_ID" ]; then
            echo "ERROR: could not resolve space '${{ env.OCTOPUS_SPACE }}' to an ID" >&2
            exit 1
          fi

          BASE_URL="$OCTOPUS_URL/api/$SPACE_ID"
          PRINTED_LINES=0

          while true; do
            TASK_JSON=$(curl -sf \
              -H "Authorization: Bearer $OCTOPUS_ACCESS_TOKEN" \
              "$BASE_URL/tasks/$TASK_ID")
            CURL_EXIT=$?

            if [ $CURL_EXIT -ne 0 ] || [ -z "$TASK_JSON" ]; then
              echo "ERROR: API call failed (curl exit $CURL_EXIT) for $BASE_URL/tasks/$TASK_ID" >&2
              exit 1
            fi

            IS_COMPLETED=$(echo "$TASK_JSON" | jq -r '.IsCompleted // false')
            TASK_STATE=$(echo   "$TASK_JSON" | jq -r '.State       // "Unknown"')

            RAW_LOGS=$(curl -sf \
              -H "Authorization: Bearer $OCTOPUS_ACCESS_TOKEN" \
              "$BASE_URL/tasks/$TASK_ID/raw")

            if [ -n "$RAW_LOGS" ]; then
              CURRENT_LINES=$(echo "$RAW_LOGS" | wc -l)
              if [ "$CURRENT_LINES" -gt "$PRINTED_LINES" ]; then
                echo "$RAW_LOGS" | sed -n "$((PRINTED_LINES + 1)),${CURRENT_LINES}p"
                PRINTED_LINES=$CURRENT_LINES
              fi
            fi

            if [ "$IS_COMPLETED" = "true" ]; then
              [ "$TASK_STATE" = "Success" ] || exit 1
              break
            fi

            sleep 5
          done
